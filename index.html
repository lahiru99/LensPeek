<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LensPeek</title>
    <link rel="stylesheet" href="dist/styles/main.css">
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1>LensPeek</h1>
        <p>Drag and drop images to inspect EXIF Data</p>
      </header> 
    <section id="dropzone" class="dropzone">
      <div class="dropzone__content">
        <p>Drag and drop images here</p>
        </div>
       </section>

       <section id="gallery" class="gallery" hidden>

       </section>

       <dialog id="lightbox" class="lightbox" hidden>

       </dialog>
  </main>

  <script type="module" src="dist/scripts/main.js"></script>

  </body>
</html>
